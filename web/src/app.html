<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply reading prefs before first paint (see lib/features/reading/prefs.svelte.ts).
			(function () {
				try {
					var p = JSON.parse(localStorage.getItem('reading-prefs') || '{}');
					var d = document.documentElement.dataset;
					if (p.size) d.readingSize = p.size;
					if (p.font) d.readingFont = p.font;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
